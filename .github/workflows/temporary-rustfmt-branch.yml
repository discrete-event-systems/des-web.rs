name: temporary-rustfmt-branch

on:
  push:
    branches:
      - agent/consolidate-des-routes

permissions:
  contents: write

concurrency:
  group: temporary-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          ssh-key: ${{ secrets.LIBS_DEPLOY_KEY }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: format and push the branch
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- src; then
            echo 'rustfmt produced no changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src
          git commit -m 'style: apply rustfmt to DES route consolidation [rustfmt applied]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
