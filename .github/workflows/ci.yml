name: ci

on:
  push:
  pull_request:

jobs:
  # Build + test. The libs submodule (ORESoftware/k8s-libs-and-shared-defs) is
  # PRIVATE: add a read-only deploy key for it as the LIBS_DEPLOY_KEY secret,
  # or this job cannot fetch the pg-defs crate and will fail at checkout.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.LIBS_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  # Prove the declarative schema story on a fresh Postgres 17 (same proof shape
  # as pg-defs CI): pg-defs schema.sql + the des-web overlay apply cleanly to an
  # empty database, the seed loads on top, and dpm (≥0.3.2, which fixes the
  # varchar IN-list convergence bug) VERIFIES the applied DB converges onto the
  # combined desired state with zero drift — enforcing, matching upstream.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.LIBS_DEPLOY_KEY }}
      - name: apply pg-defs + overlay to a fresh database, then seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database des_web_ci'
          cat libs/pg-defs/schema/schema.sql schema/des-web.sql \
            | psql -h localhost -U postgres -d des_web_ci -v ON_ERROR_STOP=1 -q
          psql -h localhost -U postgres -d des_web_ci -v ON_ERROR_STOP=1 -q -f schema/seed.sql
      - name: assert seeded pages have data
        env:
          PGPASSWORD: postgres
        run: |
          q() { psql -h localhost -U postgres -d des_web_ci -Atc "$1"; }
          test "$(q 'select count(*) >= 7 from des_web_sims')" = t
          test "$(q 'select count(*) >= 8 from des_soccer_tournament_matches')" = t
          test "$(q 'select count(*) >= 3 from des_fel_elevator_learning_runs')" = t
          test "$(q 'select count(*) >= 1 from des_web_routing_solves')" = t
      - name: install dpm 0.3.2
        run: |
          curl -fsSL -o /tmp/dpm.tar.gz \
            https://github.com/declarative-migrations/declarative-postgres-migrate.rs/releases/download/v0.3.2/dpm-v0.3.2-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/dpm.tar.gz -C /tmp
          sudo install /tmp/dpm /usr/local/bin/dpm
          dpm version
      - name: dpm verify — prove zero drift against the desired state (enforcing)
        env:
          PGPASSWORD: postgres
          SHADOW_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TARGET_DATABASE_URL: postgres://postgres:postgres@localhost:5432/des_web_ci
        run: scripts/dpm.sh verify
