name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + test. The libs submodule (ORESoftware/k8s-libs-and-shared-defs) is
  # PRIVATE: add a read-only deploy key for it as the LIBS_DEPLOY_KEY secret,
  # or this job cannot fetch the pg-defs crate and will fail at checkout.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          ssh-key: ${{ secrets.LIBS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked

  # Prove the declarative schema story on a fresh Postgres 17 (same proof shape
  # as pg-defs CI): pg-defs schema.sql + the des-web overlay apply cleanly to an
  # empty database, and the seed loads on top. dpm drift-checking runs locally /
  # against RDS via scripts/dpm.sh (see readme — the upstream varchar IN-list
  # deparse bug makes `dpm verify` advisory for now, matching pg-defs CI).
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          ssh-key: ${{ secrets.LIBS_DEPLOY_KEY }}
          persist-credentials: false
      - name: apply pg-defs + overlay to a fresh database, then seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database des_web_ci'
          cat libs/pg-defs/schema/schema.sql schema/des-web.sql \
            | psql -h localhost -U postgres -d des_web_ci -v ON_ERROR_STOP=1 -q
          psql -h localhost -U postgres -d des_web_ci -v ON_ERROR_STOP=1 -q -f schema/seed.sql
      - name: assert seeded pages have data
        env:
          PGPASSWORD: postgres
        run: |
          q() { psql -h localhost -U postgres -d des_web_ci -Atc "$1"; }
          test "$(q 'select count(*) >= 7 from des_web_sims')" = t
          test "$(q 'select count(*) >= 8 from des_soccer_tournament_matches')" = t
          test "$(q 'select count(*) >= 3 from des_fel_elevator_learning_runs')" = t
          test "$(q 'select count(*) >= 1 from des_web_routing_solves')" = t
